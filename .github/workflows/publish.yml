# Builds the plugin and attaches a release zip whenever a tag is pushed.
# This is the "publish.yml" dance the Logseq marketplace requires:
# https://github.com/logseq/marketplace#readme
name: Build plugin

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: logseq-plugin-telepathy-qr

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package release zip
        run: |
          mkdir "${{ env.PLUGIN_NAME }}"
          cp README.md LICENSE package.json icon.svg "${{ env.PLUGIN_NAME }}"
          cp -r dist "${{ env.PLUGIN_NAME }}"
          zip -r "${{ env.PLUGIN_NAME }}.zip" "${{ env.PLUGIN_NAME }}"
          ls -la

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ env.PLUGIN_NAME }}.zip,package.json"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
